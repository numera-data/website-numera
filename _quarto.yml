project:
  type: website
  output-dir: _site
  resources:
    - assets/peta/

lang: id

# Kode R hanya dijalankan ulang jika file .qmd-nya berubah.
# Hasilnya disimpan di folder _freeze/ (WAJIB ikut di-commit ke GitHub).
execute:
  freeze: auto

website:
  title: "Numera Data"
  description: "Health Data Research & Analysis Consultant — analisis data survei kesehatan, epidemiologi spasial, dan dashboard surveilans."
  site-url: "https://numera-data.github.io/website-numera"
  favicon: assets/favicon.png
  image: assets/favicon.png
  open-graph: true
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    logo:
      light: assets/logo.png
      dark: assets/logo-dark.png
    logo-alt: "Logo Numera Data"
    left:
      - href: index.qmd
        text: Beranda
      - href: tim.qmd
        text: Tim
      - href: proyek.qmd
        text: Proyek
    right:
      - icon: github
        href: https://github.com/numera-data
        aria-label: GitHub Numera Data
      - icon: envelope
        href: mailto:falah@numera.org
        aria-label: Email Numera Data
  page-footer:
    left: "© 2026 Numera Data · Health Data Research & Analysis Consultant"
    right: "Dibuat dengan [Quarto](https://quarto.org) & R"

format:
  html:
    theme:
      light: [cosmo, assets/light.scss, assets/custom.scss]
      dark: [darkly, assets/dark.scss, assets/custom.scss]
    include-in-header: assets/fonts.html
    toc: true
    toc-title: "Di halaman ini"
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true
